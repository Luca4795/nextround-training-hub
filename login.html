<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NextRound Training Hub is a training web app for boxing athletes to manage workouts, exercises and their profile." />
    <meta name="author" content="Luca De Filippo" />
    <title>Login | NextRound Training Hub</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html" class="logo">NextRound</a>
      </nav>
    </header>

    <main>
      <section>
        <h1>Login</h1>
        <p>Access your athlete dashboard and manage your training sessions.</p>

        <form id="login-form" novalidate>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required />

          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" minlength="3" required />

          <button type="submit">Login</button>
          <p id="login-message" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 NextRound Training Hub. All rights reserved.</p>
    </footer>

    <script src="js/auth.js"></script>
  </body>
</html>
